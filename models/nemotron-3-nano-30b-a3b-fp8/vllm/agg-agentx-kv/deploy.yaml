apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: nemotron3-nano-agg-agentx-kv
spec:
  components:
    - name: Frontend
      type: frontend
      replicas: 1
      podTemplate:
        spec:
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.4.0
              env:
                - name: DYN_ROUTER_MODE
                  value: kv
    - name: VllmWorker
      type: worker
      replicas: 8
      podTemplate:
        spec:
          nodeSelector:
            kubernetes.io/hostname: inst-g9dwj-devrel-rdma-pool
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.4.0
              command: [/bin/sh, -c]
              args:
                - |
                  ulimit -l unlimited
                  exec python3 -m dynamo.vllm \
                    --model "$MODEL_PATH" \
                    --served-model-name "$SERVED_MODEL_NAME" \
                    --load-format runai_streamer \
                    --trust-remote-code \
                    --tensor-parallel-size 1 \
                    --max-num-seqs 8 \
                    --enable-flashinfer-autotune \
                    --enable-prefix-caching \
                    --max-model-len 131072 \
                    --max-num-batched-tokens 16384 \
                    --kv-cache-dtype fp8_e4m3 \
                    --kv-events-config '{"publisher":"zmq","topic":"kv-events","endpoint":"tcp://*:20080","enable_kv_cache_events":true}' \
                    --dyn-tool-call-parser nemotron_nano \
                    --dyn-reasoning-parser nemotron_nano
              env:
                - name: SERVED_MODEL_NAME
                  value: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-FP8
                - name: MODEL_PATH
                  value: /model-cache/hub/models--nvidia--NVIDIA-Nemotron-3-Nano-30B-A3B-FP8/snapshots/9bee19446c0dfd01f356e10979d225b2a6621944
                - name: DYN_SYSTEM_PORT
                  value: "9090"
                - name: PYTHONHASHSEED
                  value: "0"
                - name: VLLM_USE_FLASHINFER_MOE_FP8
                  value: "1"
              ports:
                - name: system
                  containerPort: 9090
                - name: kv-events
                  containerPort: 20080
              resources:
                requests:
                  nvidia.com/gpu: "1"
                limits:
                  nvidia.com/gpu: "1"
              volumeMounts:
                - name: model-cache
                  mountPath: /model-cache
                  readOnly: true
                - name: dshm
                  mountPath: /dev/shm
          volumes:
            - name: model-cache
              persistentVolumeClaim:
                claimName: model-cache
            - name: dshm
              emptyDir:
                medium: Memory
                sizeLimit: 64Gi
