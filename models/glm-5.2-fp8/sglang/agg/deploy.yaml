apiVersion: nvidia.com/v1alpha1
kind: DynamoGraphDeployment
metadata:
  name: glm52-fp8-sglang-agg-tp16
spec:
  backendFramework: sglang
  pvcs:
    - name: model-cache
      create: false
  services:
    Frontend:
      componentType: frontend
      volumeMounts:
        - name: model-cache
          mountPoint: /opt/models
      extraPodSpec:
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/sglang-runtime:1.3.0
          workingDir: /workspace/examples/backends/sglang
      envs:
        - name: HF_HOME
          value: /opt/models
      replicas: 1
      resources:
        requests:
          cpu: "8"
          memory: 32Gi
        limits:
          cpu: "16"
          memory: 64Gi
    SglangWorker:
      componentType: worker
      multinode:
        nodeCount: 2
      volumeMounts:
        - name: model-cache
          mountPoint: /opt/models
      sharedMemory:
        size: 128Gi
      extraPodMetadata:
        annotations:
          k8s.v1.cni.cncf.io/networks: qwen32-bench/qwen-roce
      extraPodSpec:
        hostNetwork: false
        dnsPolicy: ClusterFirst
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/sglang-runtime:1.3.0
          workingDir: /workspace/examples/backends/sglang
          command:
            - /bin/sh
            - -c
          args:
            - |
              set -eu
              ulimit -l unlimited
              exec python3 -m dynamo.sglang \
                --model-path "$MODEL_PATH" \
                --served-model-name "$SERVED_MODEL_NAME" \
                --tp-size 16 \
                --ep-size 16 \
                --moe-a2a-backend deepep \
                --deepep-mode auto \
                --moe-runner-backend deep_gemm \
                --context-length 131072 \
                --chunked-prefill-size 8192 \
                --page-size 64 \
                --max-running-requests 16 \
                --mem-fraction-static 0.80 \
                --watchdog-timeout 1200 \
                --dsa-topk-backend sgl-kernel \
                --reasoning-parser glm45 \
                --dyn-reasoning-parser glm45 \
                --dyn-tool-call-parser glm47 \
                --host 0.0.0.0 \
                --enable-metrics
          env:
            - name: SERVED_MODEL_NAME
              value: zai-org/GLM-5.2-FP8
            - name: MODEL_PATH
              value: /opt/models/hub/models--zai-org--GLM-5.2-FP8/snapshots/ba978f7d347eaf65d22f1a86833408afdb953541
            - name: HF_HOME
              value: /opt/models
            - name: PYTHONHASHSEED
              value: "0"
            - name: GLOO_SOCKET_IFNAME
              value: eth0
            - name: NCCL_SOCKET_IFNAME
              value: eth0
            - name: NCCL_IB_DISABLE
              value: "0"
            - name: NCCL_IB_HCA
              value: mlx5_8:1
            - name: NCCL_DEBUG
              value: INFO
            - name: NVSHMEM_HCA_LIST
              value: mlx5_8:1
            - name: NVSHMEM_ENABLE_NIC_PE_MAPPING
              value: "1"
            - name: SGLANG_ENABLE_JIT_DEEPGEMM
              value: "1"
          securityContext:
            runAsUser: 0
            capabilities:
              add:
                - IPC_LOCK
                - SYS_RESOURCE
      replicas: 1
      resources:
        requests:
          gpu: "8"
          cpu: "32"
          memory: 256Gi
          custom:
            rdma/ib: "8"
        limits:
          gpu: "8"
          cpu: "64"
          memory: 512Gi
          custom:
            rdma/ib: "8"
