apiVersion: nvidia.com/v1alpha1
kind: DynamoGraphDeployment
metadata:
  name: glm52-fp8-vllm-agg-tp16
spec:
  backendFramework: vllm
  pvcs:
    - name: model-cache
      create: false
  services:
    Frontend:
      componentType: frontend
      volumeMounts:
        - name: model-cache
          mountPoint: /opt/models
      extraPodSpec:
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.3.0
          workingDir: /workspace/examples/backends/vllm
      envs:
        - name: HF_HOME
          value: /opt/models
      replicas: 1
      resources:
        requests:
          cpu: "8"
          memory: 32Gi
        limits:
          cpu: "16"
          memory: 64Gi
    VllmWorker:
      componentType: worker
      multinode:
        nodeCount: 2
      volumeMounts:
        - name: model-cache
          mountPoint: /opt/models
      sharedMemory:
        size: 128Gi
      extraPodMetadata:
        annotations:
          k8s.v1.cni.cncf.io/networks: roce
      extraPodSpec:
        hostNetwork: false
        dnsPolicy: ClusterFirst
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.3.0
          workingDir: /workspace/examples/backends/vllm
          command:
            - /bin/sh
            - -c
          args:
            - |
              set -eu
              ulimit -l unlimited
              exec python3 -m dynamo.vllm \
                --model "$MODEL_PATH" \
                --served-model-name "$SERVED_MODEL_NAME" \
                --tensor-parallel-size 16 \
                --pipeline-parallel-size 1 \
                --data-parallel-size 1 \
                --kv-cache-dtype fp8 \
                --gpu-memory-utilization 0.80 \
                --max-model-len 131072 \
                --max-num-seqs 16 \
                --max-num-batched-tokens 8192 \
                --enable-chunked-prefill \
                --no-enable-prefix-caching \
                --reasoning-parser glm45 \
                --dyn-reasoning-parser glm45 \
                --dyn-tool-call-parser glm47
          env:
            - name: SERVED_MODEL_NAME
              value: zai-org/GLM-5.2-FP8
            - name: MODEL_PATH
              value: /opt/models/hub/models--zai-org--GLM-5.2-FP8/snapshots/ba978f7d347eaf65d22f1a86833408afdb953541
            - name: HF_HOME
              value: /opt/models
            - name: PYTHONHASHSEED
              value: "0"
            - name: GLOO_SOCKET_IFNAME
              value: eth0
            - name: NCCL_SOCKET_IFNAME
              value: eth0
            - name: NCCL_IB_DISABLE
              value: "0"
            - name: NCCL_IB_HCA
              value: mlx5_8:1
            - name: NCCL_DEBUG
              value: INFO
            - name: VLLM_DEEP_GEMM_WARMUP
              value: skip
          securityContext:
            runAsUser: 0
            capabilities:
              add:
                - IPC_LOCK
                - SYS_RESOURCE
      replicas: 1
      resources:
        requests:
          gpu: "8"
          cpu: "32"
          memory: 256Gi
          custom:
            rdma/ib: "8"
        limits:
          gpu: "8"
          cpu: "64"
          memory: 512Gi
          custom:
            rdma/ib: "8"
