apiVersion: nvidia.com/v1alpha1
kind: DynamoGraphDeployment
metadata:
  name: qwen3-235b-a22b-fp8-vllm-disagg
spec:
  backendFramework: vllm
  pvcs:
    - name: model-cache
      create: false
  services:
    Frontend:
      componentType: frontend
      replicas: 1
      envs:
        - name: HF_HOME
          value: /opt/models
      volumeMounts:
        - name: model-cache
          mountPoint: /opt/models
      extraPodSpec:
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.3.0
          workingDir: /workspace/examples/backends/vllm
          command:
            - /bin/sh
            - -c
          args:
            - python3 -m dynamo.frontend --router-mode round-robin --http-port 8000

    VllmPrefillWorker:
      componentType: worker
      subComponentType: prefill
      replicas: 2
      envFromSecret: hf-token-secret
      sharedMemory:
        size: 80Gi
      extraPodMetadata:
        annotations:
          k8s.v1.cni.cncf.io/networks: qwen32-bench/qwen-roce
      volumeMounts:
        - name: model-cache
          mountPoint: /opt/models
      resources:
        limits:
          gpu: "4"
          custom:
            rdma/ib: "2"
        requests:
          gpu: "4"
          custom:
            rdma/ib: "2"
      extraPodSpec:
        hostNetwork: false
        dnsPolicy: ClusterFirst
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: nvidia.com/gpu.present
                      operator: In
                      values:
                        - "true"
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.3.0
          workingDir: /workspace/examples/backends/vllm
          command:
            - /bin/sh
            - -c
          args:
            - |
              ulimit -l unlimited
              exec python3 -m dynamo.vllm \
                --model "$MODEL_PATH" \
                --served-model-name "$SERVED_MODEL_NAME" \
                --tensor-parallel-size 4 \
                --data-parallel-size 1 \
                --enable-expert-parallel \
                --disaggregation-mode prefill \
                --kv-transfer-config '{"kv_connector":"NixlConnector","kv_role":"kv_both"}' \
                --gpu-memory-utilization 0.90 \
                --max-model-len 8192 \
                --enable-chunked-prefill \
                --max-num-seqs 128 \
                --max-num-batched-tokens 8192 \
                --enable-prefix-caching \
                --block-size 128 \
                --no-enable-log-requests
          env:
            - name: SERVED_MODEL_NAME
              value: Qwen/Qwen3-235B-A22B-FP8
            - name: MODEL_PATH
              value: Qwen/Qwen3-235B-A22B-FP8
            - name: HF_HOME
              value: /opt/models
            - name: PYTHONHASHSEED
              value: "0"
            - name: VLLM_NIXL_SIDE_CHANNEL_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: VLLM_NIXL_SIDE_CHANNEL_PORT
              value: "5600"
            - name: NIXL_TELEMETRY_ENABLE
              value: "y"
            - name: NIXL_TELEMETRY_EXPORTER
              value: prometheus
            - name: NIXL_TELEMETRY_MULTIPROC_DIR
              value: /dev/shm/nixl-telemetry
            - name: NIXL_TELEMETRY_PROMETHEUS_PORT
              value: "19090"
            - name: UCX_TLS
              value: rc_x,rc,cuda_copy,cuda_ipc
            - name: UCX_NET_DEVICES
              value: mlx5_8:1
            - name: UCX_IB_ADDR_TYPE
              value: eth
          securityContext:
            runAsUser: 0
            capabilities:
              add:
                - IPC_LOCK
                - SYS_RESOURCE
          ports:
            - name: system
              containerPort: 9090
            - name: nixl-side
              containerPort: 5600
            - name: nixl-metrics
              containerPort: 19090

    VllmDecodeWorker:
      componentType: worker
      subComponentType: decode
      replicas: 2
      envFromSecret: hf-token-secret
      sharedMemory:
        size: 80Gi
      extraPodMetadata:
        annotations:
          k8s.v1.cni.cncf.io/networks: qwen32-bench/qwen-roce
      volumeMounts:
        - name: model-cache
          mountPoint: /opt/models
      resources:
        limits:
          gpu: "4"
          custom:
            rdma/ib: "2"
        requests:
          gpu: "4"
          custom:
            rdma/ib: "2"
      extraPodSpec:
        hostNetwork: false
        dnsPolicy: ClusterFirst
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: nvidia.com/gpu.present
                      operator: In
                      values:
                        - "true"
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.3.0
          workingDir: /workspace/examples/backends/vllm
          command:
            - /bin/sh
            - -c
          args:
            - |
              ulimit -l unlimited
              exec python3 -m dynamo.vllm \
                --model "$MODEL_PATH" \
                --served-model-name "$SERVED_MODEL_NAME" \
                --tensor-parallel-size 4 \
                --data-parallel-size 1 \
                --enable-expert-parallel \
                --disaggregation-mode decode \
                --kv-transfer-config '{"kv_connector":"NixlConnector","kv_role":"kv_both"}' \
                --gpu-memory-utilization 0.90 \
                --max-model-len 8192 \
                --enable-chunked-prefill \
                --max-num-seqs 128 \
                --max-num-batched-tokens 8192 \
                --enable-prefix-caching \
                --block-size 128 \
                --no-enable-log-requests
          env:
            - name: SERVED_MODEL_NAME
              value: Qwen/Qwen3-235B-A22B-FP8
            - name: MODEL_PATH
              value: Qwen/Qwen3-235B-A22B-FP8
            - name: HF_HOME
              value: /opt/models
            - name: PYTHONHASHSEED
              value: "0"
            - name: VLLM_NIXL_SIDE_CHANNEL_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: VLLM_NIXL_SIDE_CHANNEL_PORT
              value: "5600"
            - name: NIXL_TELEMETRY_ENABLE
              value: "y"
            - name: NIXL_TELEMETRY_EXPORTER
              value: prometheus
            - name: NIXL_TELEMETRY_MULTIPROC_DIR
              value: /dev/shm/nixl-telemetry
            - name: NIXL_TELEMETRY_PROMETHEUS_PORT
              value: "19090"
            - name: UCX_TLS
              value: rc_x,rc,cuda_copy,cuda_ipc
            - name: UCX_NET_DEVICES
              value: mlx5_8:1
            - name: UCX_IB_ADDR_TYPE
              value: eth
          securityContext:
            runAsUser: 0
            capabilities:
              add:
                - IPC_LOCK
                - SYS_RESOURCE
          ports:
            - name: system
              containerPort: 9090
            - name: nixl-side
              containerPort: 5600
            - name: nixl-metrics
              containerPort: 19090
