apiVersion: nvidia.com/v1alpha1
kind: DynamoGraphDeployment
metadata:
  name: qwen36-35b-a3b-vllm-disagg-kv-tp2-2p2d
spec:
  backendFramework: vllm
  pvcs:
    - name: model-cache
      create: false
  services:
    Frontend:
      componentType: frontend
      volumeMounts:
        - name: model-cache
          mountPoint: /opt/models
      extraPodSpec:
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.3.0
          workingDir: /workspace/examples/backends/vllm
          command:
            - python3
            - -m
            - dynamo.frontend
          args:
            - --router-mode
            - kv
      envs:
        - name: HF_HOME
          value: /opt/models
      replicas: 1
      resources:
        requests:
          cpu: "16"
          memory: 64Gi
        limits:
          cpu: "32"
          memory: 128Gi
    VllmPrefillWorker:
      componentType: worker
      subComponentType: prefill
      volumeMounts:
        - name: model-cache
          mountPoint: /opt/models
      sharedMemory:
        size: 80Gi
      extraPodMetadata:
        annotations:
          k8s.v1.cni.cncf.io/networks: qwen-roce
      extraPodSpec:
        hostNetwork: false
        dnsPolicy: ClusterFirst
        affinity:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  labelSelector:
                    matchLabels:
                      nvidia.com/dynamo-graph-deployment-name: qwen36-35b-a3b-vllm-disagg-kv-tp2-2p2d
                      nvidia.com/dynamo-component-type: worker
                  topologyKey: kubernetes.io/hostname
        nodeSelector:
          qwen.nvidia.com/role: prefill
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.3.0
          workingDir: /workspace/examples/backends/vllm
          command:
            - /bin/sh
            - -c
          args:
            - |
              ulimit -l unlimited
              exec python3 -m dynamo.vllm \
                --model "$MODEL_PATH" \
                --served-model-name "$SERVED_MODEL_NAME" \
                --dtype auto \
                --kv-cache-dtype auto \
                --tensor-parallel-size 2 \
                --data-parallel-size 1 \
                --disaggregation-mode prefill \
                --kv-transfer-config '{"kv_connector":"NixlConnector","kv_role":"kv_producer","kv_load_failure_policy":"fail"}' \
                --kv-events-config '{"publisher":"zmq","topic":"kv-events","endpoint":"tcp://*:0","enable_kv_cache_events":true}' \
                --gpu-memory-utilization 0.85 \
                --max-model-len 131072 \
                --block-size 128 \
                --max-num-seqs 128 \
                --max-num-batched-tokens 32768 \
                --scheduling-policy fcfs \
                --no-async-scheduling \
                --enable-chunked-prefill \
                --enable-prefix-caching \
                --mamba-cache-mode align \
                --no-disable-hybrid-kv-cache-manager \
                --reasoning-parser qwen3 \
                --enable-auto-tool-choice \
                --tool-call-parser qwen3_coder
          env: &worker-env
            - name: SERVED_MODEL_NAME
              value: Qwen/Qwen3.6-35B-A3B-FP8
            - name: MODEL_PATH
              value: /opt/models/hub/models--Qwen--Qwen3.6-35B-A3B-FP8/snapshots/95a723d08a9490559dae23d0cff1d9466213d989
            - name: HF_HOME
              value: /opt/models
            - name: PYTHONHASHSEED
              value: "0"
            - name: VLLM_NIXL_SIDE_CHANNEL_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: UCX_TLS
              value: rc_x,rc,cuda_copy,cuda_ipc
            - name: UCX_NET_DEVICES
              value: mlx5_8:1
            - name: UCX_IB_ADDR_TYPE
              value: eth
            - name: UCX_RNDV_SCHEME
              value: get_zcopy
            - name: UCX_RNDV_THRESH
              value: "0"
            - name: UCX_IB_REG_METHODS
              value: odp,rcache
            - name: UCX_RCACHE_MAX_UNRELEASED
              value: "1024"
            - name: UCX_RC_TIMEOUT
              value: 600s
            - name: UCX_KEEPALIVE_INTERVAL
              value: 300s
            - name: UCX_LOG_LEVEL
              value: info
            - name: NIXL_LOG_LEVEL
              value: INFO
          securityContext: &worker-security-context
            runAsUser: 0
            capabilities:
              add:
                - IPC_LOCK
                - SYS_RESOURCE
      replicas: 2
      resources: &worker-resources
        requests:
          gpu: "2"
          cpu: "16"
          memory: 128Gi
          custom:
            rdma/ib: "2"
        limits:
          gpu: "2"
          cpu: "32"
          memory: 192Gi
          custom:
            rdma/ib: "2"
    VllmDecodeWorker:
      componentType: worker
      subComponentType: decode
      volumeMounts:
        - name: model-cache
          mountPoint: /opt/models
      sharedMemory:
        size: 80Gi
      extraPodMetadata:
        annotations:
          k8s.v1.cni.cncf.io/networks: qwen-roce
      extraPodSpec:
        hostNetwork: false
        dnsPolicy: ClusterFirst
        affinity:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  labelSelector:
                    matchLabels:
                      nvidia.com/dynamo-graph-deployment-name: qwen36-35b-a3b-vllm-disagg-kv-tp2-2p2d
                      nvidia.com/dynamo-component-type: worker
                  topologyKey: kubernetes.io/hostname
        nodeSelector:
          qwen.nvidia.com/role: decode
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.3.0
          workingDir: /workspace/examples/backends/vllm
          command:
            - /bin/sh
            - -c
          args:
            - |
              ulimit -l unlimited
              exec python3 -m dynamo.vllm \
                --model "$MODEL_PATH" \
                --served-model-name "$SERVED_MODEL_NAME" \
                --dtype auto \
                --kv-cache-dtype auto \
                --tensor-parallel-size 2 \
                --data-parallel-size 1 \
                --disaggregation-mode decode \
                --kv-transfer-config '{"kv_connector":"NixlConnector","kv_role":"kv_consumer","kv_load_failure_policy":"fail"}' \
                --gpu-memory-utilization 0.85 \
                --max-model-len 131072 \
                --block-size 128 \
                --max-num-seqs 128 \
                --max-num-batched-tokens 32768 \
                --scheduling-policy fcfs \
                --no-async-scheduling \
                --enable-chunked-prefill \
                --enable-prefix-caching \
                --mamba-cache-mode align \
                --no-disable-hybrid-kv-cache-manager \
                --reasoning-parser qwen3 \
                --enable-auto-tool-choice \
                --tool-call-parser qwen3_coder
          env: *worker-env
          securityContext: *worker-security-context
      replicas: 2
      resources: *worker-resources
