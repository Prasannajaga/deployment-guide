################################################################################
# AIPerf 0.10.0 plot configuration for the Qwen3-32B disaggregated benchmark.
#
# Matrix: ISL={1K,4K,8K,16K,32K}, OSL=256,
#         concurrency={1,8,16,32,64,128,256}.
#
# Install as the AIPerf default with:
#   install -D -m 0644 plot-config.yaml ~/.aiperf/plot_config.yaml
################################################################################

visualization:
  # For the entire 35-run result root, these plots answer two questions:
  #   1. How does each concurrency level scale as context grows?
  #   2. Where is the throughput/latency/goodput knee for each context length?
  multi_run_defaults:
    - ttft_vs_context_by_concurrency
    - tpot_vs_context_by_concurrency

  # These use client-side AIPerf records and therefore work without AIPerf GPU
  # telemetry or --slice-duration. DCGM data is plotted separately.
  single_run_defaults:
    - ttft_over_time
    - itl_over_time
    - latency_over_time
    - dispersed_throughput_over_time
    - ttft_timeline

  multi_run_plots:
    # One line per concurrency. These plots expose the cost of increasing ISL.
    throughput_vs_context_by_concurrency:
      type: scatter_line
      description: "Output-token capacity as input context grows, split by concurrency"
      x:
        metric: input_sequence_length
        stat: avg
      y:
        metric: output_token_throughput
        stat: avg
      labels: [concurrency]
      groups: [concurrency]
      autoscale: both
      x_label: "Input Sequence Length (tokens)"
      y_label: "Output Token Throughput (tokens/sec)"
      title: "Context Scaling: Output Throughput by Concurrency"

    ttft_vs_context_by_concurrency:
      type: scatter_line
      description: "Median time-to-first-token as input context grows, split by concurrency"
      x:
        metric: input_sequence_length
        stat: avg
      y:
        metric: time_to_first_token
        stat: p50
      labels: [concurrency]
      groups: [concurrency]
      autoscale: both
      x_label: "Input Sequence Length (tokens)"
      y_label: "P50 TTFT (ms)"
      title: "TTFT vs Input Context by Concurrency"

    tpot_vs_context_by_concurrency:
      type: scatter_line
      description: "Median time per output token as input context grows, split by concurrency"
      x:
        metric: input_sequence_length
        stat: avg
      y:
        metric: inter_token_latency
        stat: p50
      labels: [concurrency]
      groups: [concurrency]
      autoscale: both
      x_label: "Input Sequence Length (tokens)"
      y_label: "P50 TPOT (ms/token)"
      title: "TPOT vs Input Context by Concurrency"

    # experiment_group is the ISL directory (for example isl4096-osl256), while
    # the point label is the configured concurrency.
    ttft_capacity_pareto_by_context:
      type: pareto
      description: "Maximum output throughput before tail TTFT rises sharply"
      x:
        metric: time_to_first_token
        stat: p50
      y:
        metric: output_token_throughput
        stat: avg
      labels: [concurrency]
      groups: [experiment_group]
      autoscale: both
      x_label: "P50 TTFT (ms)"
      y_label: "Output Token Throughput (tokens/sec)"
      title: "Capacity Frontier: Output Throughput vs P50 TTFT"

    itl_capacity_pareto_by_context:
      type: pareto
      description: "Maximum output throughput before tail inter-token latency rises"
      x:
        metric: inter_token_latency
        stat: p50
      y:
        metric: output_token_throughput
        stat: avg
      labels: [concurrency]
      groups: [experiment_group]
      autoscale: both
      x_label: "P50 TPOT (ms/token)"
      y_label: "Output Token Throughput (tokens/sec)"
      title: "Capacity Frontier: Output Throughput vs P50 TPOT"

    goodput_vs_output_throughput_by_context:
      type: scatter_line
      description: "SLO-qualified request throughput as offered capacity increases"
      x:
        metric: output_token_throughput
        stat: avg
      y:
        metric: goodput
        stat: avg
      labels: [concurrency]
      groups: [experiment_group]
      autoscale: both
      x_label: "Output Token Throughput (tokens/sec)"
      y_label: "Goodput (requests/sec)"
      title: "SLO Capacity: Goodput vs Output Throughput"

    slo_pass_fraction_vs_output_throughput_by_context:
      type: scatter_line
      description: "Fraction of requests meeting both the TTFT and ITL SLOs"
      x:
        metric: output_token_throughput
        stat: avg
      y:
        metric: good_request_fraction
        stat: avg
      labels: [concurrency]
      groups: [experiment_group]
      autoscale: both
      x_label: "Output Token Throughput (tokens/sec)"
      y_label: "Good Request Fraction (ratio)"
      title: "SLO Attainment vs Output Throughput"

  single_run_plots:
    ttft_over_time:
      type: scatter
      description: "Individual TTFT values for each request"
      x: request_number
      y: time_to_first_token
      title: "TTFT Per Request"

    itl_over_time:
      type: scatter
      description: "Individual inter-token latency values for each request"
      x: request_number
      y: inter_token_latency
      title: "Inter-Token Latency Per Request"

    latency_over_time:
      type: scatter_with_percentiles
      description: "Request latency with rolling p50/p95/p99 trend lines"
      x: timestamp
      y: request_latency
      title: "Request Latency Over Time with Percentiles"

    dispersed_throughput_over_time:
      type: area
      description: "Output-token throughput over the profiling period"
      x: timestamp_s
      y: throughput_tokens_per_sec
      title: "Dispersed Output Token Throughput Over Time"

    ttft_timeline:
      type: request_timeline
      description: "Request-level TTFT and generation phases"
      x: request_start_ns
      y: time_to_first_token
      title: "Request Timeline: TTFT and Generation"

settings:
  server_metrics_downsampling:
    enabled: true
    window_size_seconds: 5.0
    aggregation_method: "mean"

# Keep experiment classification disabled for this matrix. Enabling it forces
# all multi-run plots to group by baseline/treatment and would hide the intended
# grouping by context length or concurrency.
