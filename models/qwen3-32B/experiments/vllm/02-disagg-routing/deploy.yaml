apiVersion: nvidia.com/v1alpha1
kind: DynamoGraphDeployment
metadata:
  annotations: {}
  labels:
    benchmark.nvidia.com/experiment: exp2-disagg-round-robin
  name: qwen3-32b-fp8-vllm-disagg
  namespace: qwen32-bench
spec:
  backendFramework: vllm
  pvcs:
  - create: false
    name: model-cache
  services:
    Frontend:
      componentType: frontend
      envs:
      - name: HF_HOME
        value: "/opt/models"
      - name: DYN_ROUTER_MODE
        value: round-robin
      extraPodSpec:
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.3.0
          workingDir: "/workspace/examples/backends/vllm"
      replicas: 8
      resources:
        limits:
          memory: 128Gi
        requests:
          cpu: '32'
          memory: 64Gi
      volumeMounts:
      - mountPoint: "/opt/models"
        name: model-cache
    VllmDecodeWorkerGpu05:
      componentType: worker
      envFromSecret: hf-token-secret
      extraPodMetadata:
        annotations:
          k8s.v1.cni.cncf.io/networks: qwen32-bench/qwen-roce
      extraPodSpec:
        dnsPolicy: ClusterFirst
        hostNetwork: false
        mainContainer:
          args:
          - |
            ulimit -l unlimited
            exec python3 -m dynamo.vllm \
              --model "$MODEL_PATH" \
              --served-model-name "$SERVED_MODEL_NAME" \
              --tensor-parallel-size 2 \
              --data-parallel-size 1 \
              --disaggregation-mode decode \
              --kv-transfer-config '{"kv_connector":"NixlConnector","kv_role":"kv_consumer","kv_load_failure_policy":"fail"}' \
              --gpu-memory-utilization 0.90 \
              --max-model-len 40960 \
              --enable-prefix-caching \
              --block-size 128 \
              --no-enable-log-requests
          command:
          - "/bin/sh"
          - "-c"
          env:
          - name: SERVED_MODEL_NAME
            value: Qwen/Qwen3-32B-FP8
          - name: MODEL_PATH
            value: "/opt/models/hub/models--Qwen--Qwen3-32B-FP8/snapshots/aa55da1ecc13d006e8b8e4f54579b1ea8c3db2df"
          - name: HF_HOME
            value: "/opt/models"
          - name: PYTHONHASHSEED
            value: '0'
          - name: VLLM_NIXL_SIDE_CHANNEL_HOST
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
          - name: VLLM_NIXL_SIDE_CHANNEL_PORT
            value: '5600'
          - name: NIXL_TELEMETRY_ENABLE
            value: y
          - name: NIXL_TELEMETRY_EXPORTER
            value: prometheus
          - name: NIXL_TELEMETRY_MULTIPROC_DIR
            value: "/dev/shm/nixl-telemetry"
          - name: NIXL_TELEMETRY_PROMETHEUS_PORT
            value: '19090'
          - name: UCX_TLS
            value: rc_x,rc,cuda_copy,cuda_ipc
          - name: UCX_NET_DEVICES
            value: mlx5_8:1
          - name: UCX_IB_ADDR_TYPE
            value: eth
          - name: UCX_RNDV_SCHEME
            value: get_zcopy
          - name: UCX_RNDV_THRESH
            value: '0'
          - name: UCX_IB_REG_METHODS
            value: odp,rcache
          - name: UCX_RCACHE_MAX_UNRELEASED
            value: '1024'
          - name: UCX_RC_TIMEOUT
            value: 600s
          - name: UCX_KEEPALIVE_INTERVAL
            value: 300s
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.3.0
          ports:
          - containerPort: 9090
            name: system
          - containerPort: 5600
            name: nixl-side
          - containerPort: 19090
            name: nixl-metrics
          securityContext:
            capabilities:
              add:
              - IPC_LOCK
              - SYS_RESOURCE
            runAsUser: 0
          workingDir: "/workspace/examples/backends/vllm"
        nodeSelector:
          kubernetes.io/hostname: inst-1onle-devrel-rdma-pool
      replicas: 1
      resources:
        limits:
          custom:
            rdma/ib: '2'
          gpu: '2'
        requests:
          custom:
            rdma/ib: '2'
          gpu: '2'
      sharedMemory:
        size: 40Gi
      subComponentType: decode
      volumeMounts:
      - mountPoint: "/opt/models"
        name: model-cache
    VllmDecodeWorkerGpu06:
      componentType: worker
      envFromSecret: hf-token-secret
