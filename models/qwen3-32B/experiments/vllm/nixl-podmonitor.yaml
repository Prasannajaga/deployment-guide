apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: qwen3-32b-fp8-vllm-disagg-nixl
  namespace: monitoring
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - qwen32-bench
  selector:
    matchExpressions:
      - key: nvidia.com/dynamo-graph-deployment-name
        operator: In
        values:
          - qwen3-32b-fp8-vllm-disagg-routing
          - qwen3-32b-fp8-vllm-disagg-routing-4p4d
          - qwen3-32b-fp8-vllm-disagg-kv
          - qwen3-32b-fp8-vllm-disagg-kv-offload
      - key: nvidia.com/dynamo-sub-component-type
        operator: In
        values:
          - prefill
          - decode
  podMetricsEndpoints:
    - port: nixl-metrics
      path: /metrics
      scheme: http
      interval: 5s
      scrapeTimeout: 4s
