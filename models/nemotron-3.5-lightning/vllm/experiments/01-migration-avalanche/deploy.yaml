apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: nemotron35-vllm-e1-migration
  labels:
    app.kubernetes.io/name: nemotron35-vllm-e1-migration
    app.kubernetes.io/part-of: nemotron35-research
    research.nvidia.com/experiment: migration-avalanche
spec:
  backendFramework: vllm
  components:
    - name: Frontend
      type: frontend
      replicas: 1
      podTemplate:
        spec:
          imagePullSecrets: &image_pull_secrets
            - name: nvcrimagepullsecret
          containers:
            - name: main
              image: &runtime_image nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.4.1
              imagePullPolicy: IfNotPresent
              command: [python3]
              args:
                - -m
                - dynamo.frontend
                - --router-mode
                - kv
                - --router-kv-events
                - --kv-cache-block-size
                - "64"
                - --trust-remote-code
              env:
                - name: DYN_MIGRATION_LIMIT
                  value: "3"
                - name: DYN_MIGRATION_MAX_SEQ_LEN
                  value: "65536"
                - name: DYN_HTTP_BODY_LIMIT_MB
                  value: "200"
                - name: HF_HOME
                  value: /opt/models
                - name: HF_HUB_OFFLINE
                  value: "1"
                - name: HF_MODULES_CACHE
                  value: /tmp/hf_modules
              resources:
                requests:
                  cpu: "8"
                  memory: 8Gi
                limits:
                  cpu: "16"
                  memory: 16Gi
              startupProbe:
                httpGet:
                  path: /health
                  port: 8000
                periodSeconds: 10
                timeoutSeconds: 60
                failureThreshold: 90
              volumeMounts:
                - name: model-cache
                  mountPath: /opt/models
                  readOnly: true
          volumes:
            - name: model-cache
              persistentVolumeClaim:
                claimName: model-cache

    - name: VllmPrefillWorker
      type: prefill
      replicas: 4
      sharedMemorySize: 40Gi
      podTemplate:
        metadata:
          annotations:
            k8s.v1.cni.cncf.io/networks: qwen-roce
        spec:
          imagePullSecrets: *image_pull_secrets
          hostNetwork: false
          dnsPolicy: ClusterFirst
          affinity: &h100_affinity
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: nvidia.com/gpu.present
                        operator: In
                        values: ["true"]
                      - key: nvidia.com/gpu.product
                        operator: In
                        values: [NVIDIA-H100-80GB-HBM3]
          tolerations: &gpu_tolerations
            - key: nvidia.com/gpu
              operator: Equal
              value: "true"
              effect: NoSchedule
          volumes: &worker_volumes
            - name: model-cache
              persistentVolumeClaim:
                claimName: model-cache
            - name: dshm
              emptyDir:
                medium: Memory
                sizeLimit: 40Gi
          containers:
            - name: main
              image: *runtime_image
              imagePullPolicy: IfNotPresent
              workingDir: /workspace
              command: [/bin/sh, -c]
              args:
                - |
                  set -eu
                  ulimit -l unlimited
                  exec python3 -m dynamo.vllm \
                    --model "$MODEL_PATH" \
                    --served-model-name "$SERVED_MODEL_NAME" \
                    --trust-remote-code \
                    --tensor-parallel-size 1 \
                    --max-model-len 65536 \
                    --max-num-seqs 128 \
                    --max-num-batched-tokens 32768 \
                    --gpu-memory-utilization 0.90 \
                    --async-scheduling \
                    --enable-prefix-caching \
                    --block-size 64 \
                    --mamba-cache-mode align \
                    --no-disable-hybrid-kv-cache-manager \
                    --mamba-backend flashinfer \
                    --mamba-ssm-cache-dtype float16 \
                    --enable-mamba-cache-stochastic-rounding \
                    --mamba-cache-philox-rounds 5 \
                    --dyn-tool-call-parser nemotron_nano \
                    --dyn-reasoning-parser nemotron_nano \
                    --reasoning-parser nemotron_v3 \
                    --kv-transfer-config '{"kv_connector":"NixlConnector","kv_role":"kv_producer"}' \
                    --kv-events-config '{"publisher":"zmq","topic":"kv-events","endpoint":"tcp://*:20080","enable_kv_cache_events":true}' \
                    --disaggregation-mode prefill
              env: &worker_env
                - name: SERVED_MODEL_NAME
                  value: nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4
                - name: MODEL_PATH
                  value: /opt/models/hub/models--nvidia--NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4/snapshots/cc84af2fe71647d87f4486c064f320e1e7535243
                - name: HF_HOME
                  value: /opt/models
                - name: HF_HUB_OFFLINE
                  value: "1"
                - name: HF_MODULES_CACHE
                  value: /tmp/hf_modules
                - name: TRITON_CACHE_DIR
                  value: /tmp/.triton-cache
                - name: VLLM_CONFIG_ROOT
                  value: /tmp/vllm-config
                - name: VLLM_CACHE_ROOT
                  value: /tmp/vllm-cache
                - name: VLLM_NIXL_SIDE_CHANNEL_HOST
                  valueFrom:
                    fieldRef:
                      fieldPath: status.podIP
                - name: VLLM_NIXL_SIDE_CHANNEL_PORT
                  value: "5600"
                - name: VLLM_SSM_CONV_STATE_LAYOUT
                  value: DS
                - name: NIXL_LOG_LEVEL
                  value: INFO
                - name: NIXL_TELEMETRY_ENABLE
                  value: "y"
                - name: NIXL_TELEMETRY_EXPORTER
                  value: prometheus
                - name: NIXL_TELEMETRY_PROMETHEUS_PORT
                  value: "19090"
                - name: UCX_TLS
                  value: rc_x,rc,cuda_copy,cuda_ipc
                - name: UCX_NET_DEVICES
                  value: mlx5_8:1
                - name: UCX_IB_ADDR_TYPE
                  value: eth
                - name: UCX_RCACHE_MAX_UNRELEASED
                  value: "1024"
                - name: NCCL_IB_DISABLE
                  value: "1"
                - name: PYTHONHASHSEED
                  value: "0"
              resources: &worker_resources
                requests:
                  cpu: "16"
                  memory: 96Gi
                  nvidia.com/gpu: "1"
                  rdma/ib: "1"
                limits:
                  cpu: "32"
                  memory: 128Gi
                  nvidia.com/gpu: "1"
                  rdma/ib: "1"
              securityContext: &worker_security
                runAsUser: 0
                capabilities:
                  add: [IPC_LOCK, SYS_RESOURCE]
              startupProbe: &worker_startup_probe
                httpGet:
                  path: /live
                  port: 9090
                periodSeconds: 30
                timeoutSeconds: 20
                failureThreshold: 120
              ports: &worker_ports
                - name: system
                  containerPort: 9090
                - name: nixl-side
                  containerPort: 5600
                - name: nixl-metrics
                  containerPort: 19090
              volumeMounts: &worker_mounts
                - name: model-cache
                  mountPath: /opt/models
                  readOnly: true
                - name: dshm
                  mountPath: /dev/shm

    - name: VllmDecodeWorker
      type: decode
      replicas: 8
      sharedMemorySize: 40Gi
      podTemplate:
        metadata:
          annotations:
            k8s.v1.cni.cncf.io/networks: qwen-roce
        spec:
          imagePullSecrets: *image_pull_secrets
          hostNetwork: false
          dnsPolicy: ClusterFirst
          affinity: *h100_affinity
          tolerations: *gpu_tolerations
          volumes: *worker_volumes
          containers:
            - name: main
              image: *runtime_image
              imagePullPolicy: IfNotPresent
              workingDir: /workspace
              command: [/bin/sh, -c]
              args:
                - |
                  set -eu
                  ulimit -l unlimited
                  exec python3 -m dynamo.vllm \
                    --model "$MODEL_PATH" \
                    --served-model-name "$SERVED_MODEL_NAME" \
                    --trust-remote-code \
                    --tensor-parallel-size 1 \
                    --max-model-len 65536 \
                    --max-num-seqs 128 \
                    --max-num-batched-tokens 32768 \
                    --gpu-memory-utilization 0.90 \
                    --async-scheduling \
                    --no-enable-prefix-caching \
                    --block-size 64 \
                    --mamba-cache-mode align \
                    --no-disable-hybrid-kv-cache-manager \
                    --mamba-backend flashinfer \
                    --mamba-ssm-cache-dtype float16 \
                    --enable-mamba-cache-stochastic-rounding \
                    --mamba-cache-philox-rounds 5 \
                    --dyn-tool-call-parser nemotron_nano \
                    --dyn-reasoning-parser nemotron_nano \
                    --reasoning-parser nemotron_v3 \
                    --kv-transfer-config '{"kv_connector":"NixlConnector","kv_role":"kv_consumer"}' \
                    --disaggregation-mode decode
              env: *worker_env
              resources: *worker_resources
              securityContext: *worker_security
              startupProbe: *worker_startup_probe
              ports: *worker_ports
              volumeMounts: *worker_mounts
