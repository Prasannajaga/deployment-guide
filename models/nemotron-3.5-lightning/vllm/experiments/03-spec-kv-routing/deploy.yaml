# Set experiment-cell to A, B, C, or D before applying. See README.md.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nemotron35-vllm-e3-settings
  labels:
    research.nvidia.com/experiment: spec-kv-routing
data:
  experiment-cell: A
  speculative-config: |-
    {"method":"mtp","num_speculative_tokens":7}
---
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: nemotron35-vllm-e3
  labels:
    app.kubernetes.io/name: nemotron35-vllm-e3
    app.kubernetes.io/part-of: nemotron35-research
    research.nvidia.com/experiment: spec-kv-routing
spec:
  backendFramework: vllm
  components:
    - name: Frontend
      type: frontend
      replicas: 2
      podTemplate:
        metadata:
          labels:
            app.kubernetes.io/name: nemotron35-vllm-e3
            app.kubernetes.io/component: frontend
            research.nvidia.com/experiment: spec-kv-routing
        spec:
          containers:
            - name: main
              image: &runtime_image nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.4.1
              imagePullPolicy: IfNotPresent
              command: [/bin/sh, -c]
              args:
                - |
                  set -eu
                  set -- python3 -m dynamo.frontend --trust-remote-code
                  case "$EXPERIMENT_CELL" in
                    A|B)
                      set -- "$@" --router-mode round-robin
                      ;;
                    C|D)
                      set -- "$@" \
                        --router-mode kv \
                        --router-kv-events \
                        --kv-cache-block-size 64
                      ;;
                    *)
                      echo "EXPERIMENT_CELL must be A, B, C, or D" >&2
                      exit 2
                      ;;
                  esac
                  exec "$@"
              env:
                - name: EXPERIMENT_CELL
                  valueFrom:
                    configMapKeyRef:
                      name: nemotron35-vllm-e3-settings
                      key: experiment-cell
                - name: DYN_HTTP_BODY_LIMIT_MB
                  value: "200"
                - name: HF_HOME
                  value: /opt/models
                - name: HF_HUB_OFFLINE
                  value: "1"
                - name: HF_MODULES_CACHE
                  value: /tmp/hf_modules
              resources:
                requests:
                  cpu: "8"
                  memory: 8Gi
                limits:
                  cpu: "16"
                  memory: 16Gi
              startupProbe:
                httpGet:
                  path: /health
                  port: http
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 90
              readinessProbe:
                httpGet:
                  path: /health
                  port: http
                initialDelaySeconds: 10
                periodSeconds: 10
                timeoutSeconds: 3
                failureThreshold: 3
              livenessProbe:
                httpGet:
                  path: /health
                  port: http
                initialDelaySeconds: 15
                periodSeconds: 10
                timeoutSeconds: 3
                failureThreshold: 3
              ports:
                - name: http
                  containerPort: 8000
              volumeMounts:
                - name: model-cache
                  mountPath: /opt/models
                  readOnly: true
          volumes:
            - name: model-cache
              persistentVolumeClaim:
                claimName: model-cache

    - name: VllmWorker
      type: worker
      replicas: 4
      sharedMemorySize: 40Gi
      podTemplate:
        metadata:
          labels:
            app.kubernetes.io/name: nemotron35-vllm-e3
            app.kubernetes.io/component: worker
            research.nvidia.com/experiment: spec-kv-routing
        spec:
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: nvidia.com/gpu.present
                        operator: In
                        values: ["true"]
                      - key: nvidia.com/gpu.product
                        operator: In
                        values: [NVIDIA-H100-80GB-HBM3]
          tolerations:
            - key: nvidia.com/gpu
              operator: Equal
              value: "true"
              effect: NoSchedule
          volumes:
            - name: model-cache
              persistentVolumeClaim:
                claimName: model-cache
            - name: dshm
              emptyDir:
                medium: Memory
                sizeLimit: 40Gi
          containers:
            - name: main
              image: *runtime_image
              imagePullPolicy: IfNotPresent
              workingDir: /workspace
              command: [/bin/sh, -c]
              args:
                - |
                  set -eu
                  ulimit -l unlimited
                  set -- python3 -m dynamo.vllm \
                    --model "$MODEL_PATH" \
                    --served-model-name "$SERVED_MODEL_NAME" \
                    --trust-remote-code \
                    --tensor-parallel-size 1 \
                    --max-model-len 65536 \
                    --max-num-seqs 512 \
                    --max-num-batched-tokens 32768 \
                    --gpu-memory-utilization 0.90 \
                    --async-scheduling \
                    --enable-prefix-caching \
                    --block-size 64 \
                    --mamba-cache-mode align \
                    --mamba-backend flashinfer \
                    --mamba-ssm-cache-dtype float16 \
                    --enable-mamba-cache-stochastic-rounding \
                    --mamba-cache-philox-rounds 5 \
                    --dyn-tool-call-parser nemotron_nano \
                    --dyn-reasoning-parser nemotron_nano \
                    --reasoning-parser nemotron_v3 \
                    --disaggregation-mode agg

                  case "$EXPERIMENT_CELL" in
                    A)
                      ;;
                    B)
                      set -- "$@" --speculative-config "$SPECULATIVE_CONFIG"
                      ;;
                    C)
                      set -- "$@" --kv-events-config "$KV_EVENTS_CONFIG"
                      ;;
                    D)
                      set -- "$@" \
                        --speculative-config "$SPECULATIVE_CONFIG" \
                        --kv-events-config "$KV_EVENTS_CONFIG"
                      ;;
                    *)
                      echo "EXPERIMENT_CELL must be A, B, C, or D" >&2
                      exit 2
                      ;;
                  esac
                  exec "$@"
              env:
                - name: EXPERIMENT_CELL
                  valueFrom:
                    configMapKeyRef:
                      name: nemotron35-vllm-e3-settings
                      key: experiment-cell
                - name: SPECULATIVE_CONFIG
                  valueFrom:
                    configMapKeyRef:
                      name: nemotron35-vllm-e3-settings
                      key: speculative-config
                - name: KV_EVENTS_CONFIG
                  value: '{"publisher":"zmq","topic":"kv-events","endpoint":"tcp://*:20080","enable_kv_cache_events":true}'
                - name: SERVED_MODEL_NAME
                  value: nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4
                - name: MODEL_PATH
                  value: /opt/models/hub/models--nvidia--NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4/snapshots/cc84af2fe71647d87f4486c064f320e1e7535243
                - name: HF_HOME
                  value: /opt/models
                - name: HF_HUB_OFFLINE
                  value: "1"
                - name: HF_MODULES_CACHE
                  value: /tmp/hf_modules
                - name: TRITON_CACHE_DIR
                  value: /tmp/.triton-cache
                - name: VLLM_CONFIG_ROOT
                  value: /tmp/vllm-config
                - name: VLLM_CACHE_ROOT
                  value: /tmp/vllm-cache
                - name: NCCL_IB_DISABLE
                  value: "1"
                - name: PYTHONHASHSEED
                  value: "0"
              resources:
                requests:
                  cpu: "16"
                  memory: 96Gi
                  nvidia.com/gpu: "1"
                limits:
                  cpu: "32"
                  memory: 128Gi
                  nvidia.com/gpu: "1"
              securityContext:
                runAsUser: 0
                capabilities:
                  add: [IPC_LOCK, SYS_RESOURCE]
              startupProbe:
                httpGet:
                  path: /live
                  port: 9090
                periodSeconds: 30
                timeoutSeconds: 20
                failureThreshold: 120
              ports:
                - name: system
                  containerPort: 9090
              volumeMounts:
                - name: model-cache
                  mountPath: /opt/models
                  readOnly: true
                - name: dshm
                  mountPath: /dev/shm
