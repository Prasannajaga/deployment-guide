apiVersion: nvidia.com/v1alpha1
kind: DynamoGraphDeployment
metadata:
  name: qwen3-32b-fp8-vllm-agg
  labels:
    benchmark.nvidia.com/experiment: qwen3-32b-fp8-vllm-agg
spec:
  backendFramework: vllm
  pvcs:
    - name: model-cache
      create: false
    - name: compilation-cache
      create: false
  services:
    Frontend:
      componentType: frontend
      replicas: 2
      envs:
        - name: HF_HOME
          value: /opt/models
      resources:
        requests:
          cpu: "8"
          memory: 8Gi
        limits:
          cpu: "16"
          memory: 16Gi
      volumeMounts:
        - name: model-cache
          mountPoint: /opt/models
      extraPodSpec:
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.3.0
          workingDir: /workspace
          command: [python3, -m, dynamo.frontend]
          args: [--router-mode, round-robin]

    VllmWorker:
      componentType: worker
      replicas: 8
      envFromSecret: hf-token-secret
      sharedMemory:
        size: 40Gi
      volumeMounts:
        - name: model-cache
          mountPoint: /opt/models
        - name: compilation-cache
          mountPoint: /home/dynamo/.cache/vllm
          useAsCompilationCache: true
      extraPodSpec:
        hostNetwork: false
        dnsPolicy: ClusterFirst
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.3.0
          workingDir: /workspace
          command: [/bin/sh, -c]
          args:
            - |
              ulimit -l unlimited
              exec python3 -m dynamo.vllm \
                --model "$MODEL_PATH" \
                --served-model-name "$SERVED_MODEL_NAME" \
                --tensor-parallel-size 2 \
                --gpu-memory-utilization 0.90 \
                --max-model-len 40960 \
                --enable-prefix-caching \
                --block-size 128 \
                --no-enable-log-requests
          env:
            - name: SERVED_MODEL_NAME
              value: Qwen/Qwen3-32B-FP8
            - name: MODEL_PATH
              value: /opt/models/hub/models--Qwen--Qwen3-32B-FP8/snapshots/aa55da1ecc13d006e8b8e4f54579b1ea8c3db2df
            - name: HF_HOME
              value: /opt/models
            - name: PYTHONHASHSEED
              value: "0"
          securityContext:
            runAsUser: 0
            capabilities:
              add: [IPC_LOCK, SYS_RESOURCE]
          ports:
            - name: system
              containerPort: 9090
      resources:
        requests:
          gpu: "2"
        limits:
          gpu: "2"
