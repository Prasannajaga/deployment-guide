apiVersion: batch/v1
kind: Job
metadata:
  name: deepseek-v4-flash-fp8-download
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: deepseek-v4-flash-fp8-download
    spec:
      restartPolicy: Never
      containers:
        - name: model-download
          image: python:3.10-slim
          command:
            - /bin/sh
            - -c
          args:
            - |
              set -eu
              pip install --no-cache-dir huggingface_hub==1.16.4
              hf download "$MODEL_NAME" --revision "$MODEL_REVISION"
          env:
            - name: MODEL_NAME
              value: sgl-project/DeepSeek-V4-Flash-FP8
            - name: MODEL_REVISION
              value: ae01d80c06cdfe30581edfd0e1c5449dc7ed7f17
            - name: HF_HOME
              value: /model-store
            - name: HF_XET_HIGH_PERFORMANCE
              value: "1"
          envFrom:
            - secretRef:
                name: hf-token-secret
                optional: true
          resources:
            requests:
              cpu: "4"
              memory: 64Gi
            limits:
              cpu: "8"
              memory: 64Gi
          volumeMounts:
            - name: model-cache
              mountPath: /model-store
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-cache
